  };
  // Store path -> language. A store whose language is not in STR yet shows English.
  var STORE_LANG = { dkk_dk_den: "da", gbp_uk_eng: "en", eur_eu_eng: "en", usd_us_eng: "en", eur_eu_ger: "de", eur_eu_fra: "fr", eur_eu_ita: "it", eur_eu_spa: "es", eur_eu_ned: "nl", eur_eu_por: "pt", sek_se_swe: "sv", nok_no_nor: "nb", eur_eu_fin: "fi", pln_pl_pol: "pl", eur_eu_rou: "ro", eur_eu_cze: "cs", eur_eu_svk: "sk", eur_eu_hun: "hu" };
  var SINGLE = { stock: 1 };
  var REORDER = { stock: 1, other_channel: 1 };
  var seg = (location.pathname.split("/")[1] || "").toLowerCase();
  var store = STORE_LANG[seg] ? seg : "";
  var L = STR[store ? STORE_LANG[store] : (document.documentElement.lang || "en").slice(0, 2)] ? (store ? STORE_LANG[store] : document.documentElement.lang.slice(0, 2)) : "en";
  var T = STR[L];
  var api = root.getAttribute("data-api");
  var started = Date.now();
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var q = function (s) { return root.querySelector(s); };
  var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
  var mem = {
    get: function (k) { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set: function (k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  };
  var token = (function () {
    var m = /(?:^|[#&])k=([a-z0-9]{6,16})/i.exec(location.hash || "");
    if (m) { mem.set("wpfb-k", m[1].toLowerCase()); return m[1].toLowerCase(); }
    return mem.get("wpfb-k");
  })();
  var isTest = token === "test";
  var sid = mem.get("wpfb-sid");
  if (!/^[a-z0-9]{8,24}$/.test(sid)) {
    var abc = "abcdefghijklmnopqrstuvwxyz0123456789", b = new Uint8Array(16);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b); else for (var j = 0; j < 16; j++) b[j] = Math.random() * 256 | 0;
    sid = ""; for (var i = 0; i < 16; i++) sid += abc[b[i] % 36];
    mem.set("wpfb-sid", sid);
  }
  var S = { reason: "", details: [], followup: "", contact: "", email: "", step: 1, firma: "" };
  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12.4 3.6 3.6L18 7.8"/></svg>';

  qa("[data-t]").forEach(function (el) { var k = el.getAttribute("data-t"); if (typeof T[k] === "string") el.textContent = T[k]; });
  if (store) {
    q("[data-shop]").setAttribute("href", "/" + store + "/");
    q("[data-history]").setAttribute("href", "/" + store + "/sales/order/history/");
  }

  function payload(step) {
    return { k: token, sid: sid, store: store, lang: L, reason: S.reason, details: S.details, followup: S.followup, contact: S.contact, email: S.email, step: step, hp: q("input[name=hp]").value, ms: Date.now() - started };
  }
  function save(step) {
    if (!api || !window.fetch || !S.reason) return Promise.reject(new Error("no"));
    return fetch(api + "?action=submit", { method: "POST", headers: { "content-type": "text/plain;charset=UTF-8" }, body: JSON.stringify(payload(step)), keepalive: true })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); });
  }
  function quiet(p) { p.catch(function () {}); }

  function restart(el) { el.classList.remove("is-in"); void el.offsetWidth; el.classList.add("is-in"); }
  function head(n) {
    var h = q("[data-h]"), sub = q("[data-sub]");
    if (n === 1) { h.textContent = T.h1; sub.textContent = T.sub1; }
    if (n === 2) { h.textContent = T["q2_" + S.reason]; sub.textContent = S.reason === "other" ? T.sub2_text : SINGLE[S.reason] ? T.sub2_one : T.sub2_many; }
    if (n === 3) { h.textContent = T.h3; sub.textContent = T.sub3; }
    if (n === 4) { h.textContent = S.firma ? T.thanks_name.replace("{firma}", S.firma) : T.thanks; sub.textContent = T.sub4; }
    q("[data-meta]").textContent = n < 4 ? T.step.replace("{n}", n) : T.done_meta;
    q("[data-time]").hidden = n !== 1;
    qa(".wpfb-prog i").forEach(function (d, k) { d.classList.toggle("on", k < Math.min(n, 3)); });
  }
  function go(n, silent) {
    S.step = n;
    qa("[data-step]").forEach(function (s) { var on = +s.getAttribute("data-step") === n; s.hidden = !on; if (on && !silent) restart(s); });
    head(n);
    if (!silent) restart(q("[data-hx]"));
    q("[data-back]").hidden = !(n === 2 || n === 3);
    q("[data-err]").hidden = true;
    if (silent) return;
    var h = q("[data-h]");
    try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); }
    var top = root.getBoundingClientRect().top;
    if (top < 0) window.scrollTo({ top: window.pageYOffset + top - 100, behavior: reduce ? "auto" : "smooth" });
  }
  function err(msg) { var e = q("[data-err]"); e.textContent = msg; e.hidden = false; }

  function markTiles() { qa(".wpfb-tile").forEach(function (t) { t.classList.toggle("is-on", t.querySelector("input").checked); }); }
  function markChips() { qa(".wpfb-chip").forEach(function (c) { c.classList.toggle("is-on", c.querySelector("input").checked); }); }
  function buildChips() {
    var box = q("[data-chips]"), list = T["c_" + S.reason] || [], one = !!SINGLE[S.reason];
    box.innerHTML = "";
    box.hidden = !list.length;
    box.setAttribute("role", one ? "radiogroup" : "group");
    list.forEach(function (c) {
      var l = document.createElement("label"), inp = document.createElement("input"), s = document.createElement("span");
      l.className = "wpfb-chip"; inp.type = one ? "radio" : "checkbox"; inp.name = "detail"; inp.value = c[0];
      inp.checked = S.details.indexOf(c[0]) > -1; s.textContent = c[1];
      l.appendChild(inp); l.insertAdjacentHTML("beforeend", CHECK); l.appendChild(s); box.appendChild(l);
    });
    markChips();
    var ta = q("textarea[name=followup]");
    q("[data-more]").textContent = S.reason === "other" ? T.more_other : T.more;
    ta.setAttribute("placeholder", T.placeholder);
    ta.value = S.followup;
  }

  var advance = 0, pending = 0;
  function toTwo() {
    if (!S.reason) { err(T.err_reason); return; }
    clearTimeout(pending); clearTimeout(advance);
    quiet(save(1));
    buildChips();
    go(2);
  }
  function toThree() { S.followup = q("textarea[name=followup]").value; quiet(save(2)); go(3); }
  function finish(btn) {
    var label = btn ? btn.innerHTML : "";
    qa("[data-step='3'] button").forEach(function (b) { b.disabled = true; });
    if (btn) btn.textContent = T.sending;
    save(3).then(function () {
      mem.set("wpfb-done-" + (token || sid), "1");
      q("[data-done-text]").textContent = S.contact === "yes" ? T.done_yes : T.done_no;
      q("[data-history]").hidden = !REORDER[S.reason];
      go(4);
    }).catch(function () { err(T.err_send); }).then(function () {
      qa("[data-step='3'] button").forEach(function (b) { b.disabled = false; });
      if (btn) btn.innerHTML = label;
    });
  }

  root.addEventListener("change", function (e) {
    var t = e.target;
    if (t.name === "reason") {
      if (S.reason !== t.value) S.details = [];
      S.reason = t.value;
      markTiles();
      q("[data-next1-box]").hidden = false;
      q("[data-err]").hidden = true;
      clearTimeout(pending);
      pending = setTimeout(function () { quiet(save(1)); }, 700);
    }
    if (t.name === "detail") {
      S.details = qa("input[name=detail]:checked").map(function (x) { return x.value; });
      markChips();
    }
  });
  // A tap or click on a reason moves on by itself; arrow keys only select, so a keyboard user is never carried off.
  q("[data-tiles]").addEventListener("pointerup", function (e) {
    var tile = e.target.closest && e.target.closest(".wpfb-tile");
    if (!tile || e.button > 0) return;
    var v = tile.querySelector("input").value;
    clearTimeout(advance);
    advance = setTimeout(function () { if (S.step === 1 && S.reason === v) toTwo(); }, reduce ? 150 : 480);
  });
  root.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("button") : null;
    if (!t || !root.contains(t)) return;
    if (t.hasAttribute("data-skip")) { toThree(); }
    if (t.hasAttribute("data-back")) { go(S.step === 3 ? 2 : 1); if (S.step === 2) buildChips(); }
    if (t.hasAttribute("data-edit")) { go(1); markTiles(); }
    var c = t.getAttribute("data-contact");
    if (c) {
      S.contact = c;
      qa("[data-contact]").forEach(function (b) { b.setAttribute("aria-pressed", String(b === t)); });
      if (c === "yes" && (!token || isTest)) { q("[data-emailbox]").hidden = false; q("input[name=email]").focus(); }
      else { q("[data-emailbox]").hidden = true; finish(t); }
    }
  });
  q("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (S.step === 1) toTwo();
    else if (S.step === 2) toThree();
    else if (S.step === 3) { S.email = q("input[name=email]").value; finish(q("[data-emailbox] .wpfb-btn")); }
  });

  if (token && !isTest && api && window.fetch) {
    fetch(api + "?action=who&k=" + encodeURIComponent(token)).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.known || !j.firma) return;
      S.firma = j.firma;
      var hi = q("[data-hi]"); hi.textContent = T.hi.replace("{firma}", j.firma); hi.hidden = false;
      if (S.step === 4) head(4);
    }).catch(function () {});
  }
  if (mem.get("wpfb-done-" + (token || sid))) { q("[data-done-text]").textContent = T.done_no; go(4, true); }
  else go(1, true);
