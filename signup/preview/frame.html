<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Westpack store (preview)</title>
<meta name="robots" content="noindex">
<style>
  /* A stand-in for a Westpack store page: the real store's header, a screenshot of its home page, and enough
     length to scroll. The experiences run on top of it exactly as they would on the store. */
  html, body { margin: 0; background: #fff; font-family: Arial, sans-serif; }
  .bar { background: #222; color: #fff; font-size: 12px; text-align: center; padding: 6px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 2; }
  header b { font-size: 22px; letter-spacing: 0.08em; }
  header nav { display: flex; gap: 18px; font-size: 14px; color: #333; }
  .shot { display: block; width: 100%; height: auto; }
  .filler { height: 140vh; background: linear-gradient(#fafafa, #f0f0f0); }
  @media (max-width: 700px) { header nav { display: none; } }
</style>
</head>
<body>
<div class="bar">Free shipping on orders above the threshold · Logo print on jewellery boxes</div>
<header><b>WESTPACK</b><nav><span>Jewellery Boxes</span><span>Displays</span><span>Gift Packaging</span><span>Bags</span><span>Logo Printing</span></nav></header>
<picture>
  <source media="(max-width: 700px)" srcset="shots/store-mobile.webp">
  <img class="shot" src="shots/store-desktop.webp" alt="">
</picture>
<div class="filler"></div>
<script>
  // ?market=<store code>&concept=<id>&open=1|peek&lang=..&reset=1 - the preview controls drive this page through the URL
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get("reset") === "1") { try { localStorage.removeItem("wps:v1"); sessionStorage.removeItem("wps:session:v1"); } catch (e) {} }
    var s = document.createElement("script");
    s.src = "../westpack-signup.js?v=" + Date.now();
    s.async = true;
    s.dataset.mode = "preview";
    s.dataset.market = q.get("market") || "dkk_dk_den";
    if (q.get("concept")) s.dataset.concept = q.get("concept");
    if (q.has("track")) s.dataset.track = q.get("track");
    if (q.get("dry") === "1") s.dataset.dry = "1";
    if (q.get("doi") === "1") s.dataset.doi = "1";
    s.onload = function () {
      var W = window.WestpackSignup;
      W.on("flush", function (p) { parent.postMessage({ wps: "flush", payload: p }, "*"); });
      W.on("step", function (d) { parent.postMessage({ wps: "step", detail: d }, "*"); });
      W.on("subscribed", function (d) { parent.postMessage({ wps: "subscribed", detail: d }, "*"); });
      W.ready.then(function () {
        var mode = q.get("open") || "1";
        if (mode === "peek") W.peek(q.get("concept"));
        else if (mode !== "0") setTimeout(function () { W.open(q.get("concept"), "preview"); }, Number(q.get("delay") || 400));
      });
    };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
