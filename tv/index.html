<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050403">
  <title>Westpack - Brændeovnen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tv/tv.css">
</head>
<body>
  <canvas id="tv-fire" aria-hidden="true"></canvas>

  <!-- Without WebGL2 the figures still show, on a still warm background. -->
  <div class="tv-fallback" id="tv-fallback" hidden>
    <p class="tv-fallback-eyebrow" id="tv-fallback-eyebrow"></p>
    <p class="tv-fallback-value"><span id="tv-fallback-value"></span><span class="tv-fallback-suffix" id="tv-fallback-suffix"></span></p>
    <p class="tv-fallback-line" id="tv-fallback-line"></p>
  </div>

  <form class="tv-login" id="tv-login" hidden autocomplete="off">
    <p class="tv-login-eyebrow">Westpack</p>
    <h1 class="tv-login-title">Tænd for brændeovnen</h1>
    <p class="tv-login-copy">Skriv koden til Westpack Marketing OS. Skærmen husker den, så det kun skal gøres én gang.</p>
    <label class="tv-login-field">
      <span>Kode</span>
      <input id="tv-login-password" type="password" autocomplete="current-password" required>
    </label>
    <button class="tv-login-button" type="submit" id="tv-login-button">Tænd</button>
    <p class="tv-login-error" id="tv-login-error" role="alert" hidden></p>
  </form>

  <p class="tv-hint" id="tv-hint" hidden>Tryk <kbd>F</kbd> eller klik for fuld skærm</p>
  <pre class="tv-debug" id="tv-debug" hidden></pre>

  <script src="/tv/fire-engine.js"></script>
  <script src="/tv/tv.js"></script>
</body>
</html>
